<!doctype html>
<html lang="en">
  <head> 
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">

      <!-- Make sure your local image path is handled or replaced with a relative web asset if deploying -->
      <img src="image/Profile-Transparent.png" alt="Profile Image" />
      
      <h2>Login System</h2>

      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Password" />

      <button onclick="login()">Login</button>

      <p>Don't have an account?</p>

      <input type="text" id="name" placeholder="Name" />
      <button onclick="register()">Register</button>

      <p id="message"></p>
    </div>

    <!-- Keep only app.js for handling frontend logic and API calls -->
    <script src="app.js"></script>
  </body>
</html>
